<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Executive Geospatial Route Radar (World & India)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #030712; }
        
        .header-panel {
            position: absolute; top: 12px; left: 14px; z-index: 1000;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(14px);
            padding: 10px 16px; border-radius: 12px; border: 1px solid #1e293b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); pointer-events: auto;
        }
        .header-title { font-size: 13px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; margin: 0; }
        .header-sub { font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
        
        .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; }
        .badge-verified { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
        .badge-live { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }

        .legend-panel {
            position: absolute; bottom: 18px; right: 14px; z-index: 1000;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(14px);
            padding: 10px 14px; border-radius: 10px; border: 1px solid #1e293b;
            font-size: 11px; max-height: 180px; overflow-y: auto; pointer-events: auto;
        }
        .legend-title { font-weight: 700; color: #94a3b8; margin-bottom: 6px; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
        .legend-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
        .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

        /* Custom marker styling */
        .custom-pin {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .pin-beacon {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 12px; color: #ffffff;
            box-shadow: 0 0 15px currentColor; border: 2px solid #ffffff;
            position: relative;
        }
        .pin-halo {
            position: absolute; width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid currentColor; opacity: 0.5; animation: pulse 2s infinite;
        }
        .pin-label {
            margin-top: 4px; background: rgba(15, 23, 42, 0.9);
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
            white-space: nowrap; border: 1px solid #334155; color: #f1f5f9;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            70% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .leaflet-popup-content-wrapper {
            background: #0f172a !important; color: #f8fafc !important;
            border: 1px solid #334155; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .leaflet-popup-tip { background: #0f172a !important; }
    </style>
</head>
<body>
    <div class="header-panel">
        <h4 class="header-title">
            <span>🌐 Executive Geospatial Route Radar</span>
            <span id="route-badge" class="badge badge-verified">A3J: ALLOW_DEPLOYMENT</span>
        </h4>
        <div id="route-info" class="header-sub">
            Loading route telemetry...
        </div>
    </div>

    <div class="legend-panel">
        <div class="legend-title">Route Entity Categories:</div>
        <div class="legend-row"><span class="legend-dot" style="background:#4285F4;"></span> Googleplex & Campuses</div>
        <div class="legend-row"><span class="legend-dot" style="background:#0284c7;"></span> Aviation Hubs (SFO/DEL/BLR/MEX)</div>
        <div class="legend-row"><span class="legend-dot" style="background:#38bdf8;"></span> High-Speed Rail & Express Terminals</div>
        <div class="legend-row"><span class="legend-dot" style="background:#f59e0b;"></span> UNESCO World Heritage Sites</div>
        <div class="legend-row"><span class="legend-dot" style="background:#34A853;"></span> Regional Tech Campuses</div>
    </div>

    <div id="map"></div>

    <script>
        var map = L.map('map', {
            zoomControl: true,
            attributionControl: false,
            minZoom: 2,
            maxZoom: 18
        }).setView([20.5937, 78.9629], 4);

        // Watermark-Free High-Definition Dark Canvas
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: '&copy; Esri & OpenStreetMap'
        }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: '&copy; Esri'
        }).addTo(map);

        var currentMarkers = [];
        var currentPolyline = null;
        var currentGlowLine = null;
        var lastSyncTimestamp = 0;

        function updateRouteOnMap(entities, queryText, specialistName) {
            if (!entities || entities.length === 0) return;

            // Remove old layers
            currentMarkers.forEach(function(m) { map.removeLayer(m); });
            currentMarkers = [];
            if (currentPolyline) map.removeLayer(currentPolyline);
            if (currentGlowLine) map.removeLayer(currentGlowLine);

            var latlngs = [];
            entities.forEach(function(ent, idx) {
                var lat = ent.lat || 0;
                var lon = ent.lon || 0;
                if (lat === 0 && lon === 0) return;

                var color = ent.color || '#38bdf8';
                latlngs.push([lat, lon]);

                var icon = L.divIcon({
                    className: 'custom-pin',
                    html: '<div class="pin-beacon" style="background:' + color + '; color:#fff;">' +
                          '  <div class="pin-halo" style="color:' + color + ';"></div>' +
                          '  #' + (idx + 1) +
                          '</div>' +
                          '<div class="pin-label">' + ent.name.replace('Mountain View ', '').replace('Google ', '').replace('International ', '').replace('Campus ', '') + '</div>',
                    iconSize: [120, 50],
                    iconAnchor: [60, 20]
                });

                var marker = L.marker([lat, lon], { icon: icon }).addTo(map);
                var popupHtml = '<div style="font-size:12px; font-family:sans-serif;">' +
                                '<strong style="color:#38bdf8;">#' + (idx + 1) + ' ' + ent.name + '</strong><br>' +
                                '<span style="color:#94a3b8;">Sector: ' + (ent.sector || 'GLOBAL') + ' | Type: ' + (ent.type || 'Entity') + '</span><br>' +
                                '<span style="color:#64748b; font-family:monospace;">Coordinates: ' + lat.toFixed(4) + '°, ' + lon.toFixed(4) + '°</span><br>' +
                                '<div style="margin-top:6px; color:#34d399; font-weight:bold;">✔ Dijkstra Shortest Path Verified</div>' +
                                '</div>';
                marker.bindPopup(popupHtml);
                currentMarkers.push(marker);
            });

            if (latlngs.length >= 2) {
                // Outer glow line
                currentGlowLine = L.polyline(latlngs, {
                    color: '#38bdf8',
                    weight: 8,
                    opacity: 0.35,
                    lineCap: 'round',
                    smoothFactor: 1
                }).addTo(map);

                // Main route line with animated dash
                currentPolyline = L.polyline(latlngs, {
                    color: '#34d399',
                    weight: 3,
                    opacity: 0.95,
                    dashArray: '8, 6',
                    lineCap: 'round',
                    smoothFactor: 1
                }).addTo(map);

                map.fitBounds(L.latLngBounds(latlngs), { padding: [70, 70], maxZoom: 12 });
            } else if (latlngs.length === 1) {
                map.setView(latlngs[0], 10);
            }

            // Update header info
            var count = entities.length;
            var infoEl = document.getElementById('route-info');
            infoEl.innerHTML = 'Active Specialist: <strong style="color:#f8fafc;">' + (specialistName || 'EnterpriseSwarm') + '</strong> | ' +
                               'Waypoints: <strong style="color:#38bdf8;">' + count + '</strong> | ' +
                               'Relational Hops: <strong style="color:#38bdf8;">' + (count > 0 ? count - 1 : 0) + '</strong> | ' +
                               '<span style="color:#34d399;">Dijkstra THD: 0.00</span>';
        }

        // Poll for sync events
        function pollSyncEvent() {
            fetch('/api/sync-event')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var ev = (data && data.event) ? data.event : data;
                    if (ev && ev.timestamp && ev.timestamp !== lastSyncTimestamp) {
                        lastSyncTimestamp = ev.timestamp;
                        if (ev.entities && ev.entities.length > 0) {
                            updateRouteOnMap(ev.entities, ev.query, ev.specialist);
                        }
                    }
                })
                .catch(function(err) {});
        }

        // Listen for postMessage from parent iframe
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'UPDATE_ROUTE' && e.data.entities) {
                updateRouteOnMap(e.data.entities, e.data.query, e.data.specialist);
            }
        });

        // Initialize polling every 1.2s
        setInterval(pollSyncEvent, 1200);
        pollSyncEvent();
    </script>
</body>
</html>

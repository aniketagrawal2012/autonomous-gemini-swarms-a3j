<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Topological Graph DAG: Taj Mahal</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { margin: 0; background: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; overflow: hidden; }
        #network { width: 100vw; height: 100vh; }
        .header { position: absolute; top: 15px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(10px); padding: 14px 22px; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .legend { position: absolute; bottom: 25px; right: 25px; z-index: 10; background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(10px); padding: 14px 20px; border-radius: 12px; border: 1px solid #1e293b; font-size: 12px; max-height: 280px; overflow-y: auto; }
        .legend-item { display: flex; align-items: center; margin: 5px 0; font-weight: 500; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .badge { background: #0284c7; color: white; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h3 style="margin: 0 0 4px 0; color: #38bdf8; display: flex; align-items: center;">
            ⚡ Zero-Hallucination GraphRAG Topology <span class="badge">Enterprise Multi-Domain</span>
        </h3>
        <span style="font-size: 13px; color: #94a3b8;">Root Node: <strong style="color: #f1f5f9;">Taj Mahal</strong> | Active Nodes: <strong style="color: #38bdf8;">3</strong></span>
    </div>
    <div class="legend">
        <div style="font-weight: bold; margin-bottom: 8px; color: #94a3b8; letter-spacing: 0.5px;">ONTOLOGY NODES:</div>
        <div class="legend-item"><span class="dot" style="background:#ef4444;"></span> Threat Actor / Red Node</div>
        <div class="legend-item"><span class="dot" style="background:#f97316;"></span> Malware / Infrastructure</div>
        <div class="legend-item"><span class="dot" style="background:#38bdf8;"></span> Holding / Travel Hub</div>
        <div class="legend-item"><span class="dot" style="background:#6366f1;"></span> Corporate Public Entity</div>
        <div class="legend-item"><span class="dot" style="background:#10b981;"></span> Index / Mitigation</div>
        <div class="legend-item"><span class="dot" style="background:#f59e0b;"></span> UNESCO Heritage / Regulator</div>
    </div>
    <div id="network"></div>
    <script type="text/javascript">
        var nodes = new vis.DataSet([{"id": "Taj Mahal", "label": "Taj Mahal", "color": "#f59e0b", "size": 22, "title": "Domain: Tourism | Type: UNESCOHeritage"}, {"id": "Agra", "label": "Agra", "color": "#8b5cf6", "size": 16, "title": "Domain: Tourism | Type: TouristCity"}, {"id": "Archaeological Survey of India", "label": "Archaeological Survey of India", "color": "#64748b", "size": 16, "title": "Domain: Tourism | Type: Authority"}]);
        var edges = new vis.DataSet([{"from": "Agra", "to": "Taj Mahal", "label": "HOME_TO", "color": {"color": "#94a3b8", "highlight": "#38bdf8"}, "arrows": "to"}, {"from": "Taj Mahal", "to": "Archaeological Survey of India", "label": "MANAGED_BY", "color": {"color": "#94a3b8", "highlight": "#38bdf8"}, "arrows": "to"}]);
        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };
        var options = {
            nodes: { shape: 'dot', font: { color: '#f8fafc', size: 14 } },
            edges: { font: { color: '#94a3b8', size: 11, align: 'middle' }, smooth: { type: 'continuous' } },
            physics: { stabilization: true, barnesHut: { gravitationalConstant: -3500, springLength: 130 } }
        };
        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
